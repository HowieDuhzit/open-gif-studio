<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open GIF Studio social card</title>
  <desc id="desc">Free open-source GIF editor for the modern web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="0.58" stop-color="#202018"/>
      <stop offset="1" stop-color="#10261a"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="rgba(245,245,220,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1000" cy="130" r="220" fill="#058c42" opacity="0.22"/>
  <circle cx="1040" cy="500" r="190" fill="#ea701d" opacity="0.18"/>
  <rect x="76" y="74" width="1048" height="482" rx="28" fill="rgba(32,32,32,0.92)" stroke="rgba(245,245,220,0.2)" filter="url(#shadow)"/>
  <rect x="112" y="112" width="976" height="68" rx="12" fill="#25231f" stroke="rgba(245,245,220,0.14)"/>
  <image href="logo.png" x="128" y="104" width="84" height="84" preserveAspectRatio="xMidYMid meet" filter="url(#logoShadow)"/>
  <text x="242" y="155" fill="#f5f5dc" font-family="Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="5">OPEN GIF STUDIO</text>
  <g transform="translate(116 214)">
    <rect width="262" height="236" rx="18" fill="#151515" stroke="rgba(245,245,220,0.18)"/>
    <rect x="24" y="18" width="214" height="160" rx="12" fill="#101318" stroke="rgba(245,245,220,0.14)"/>
    <image href="logo.png" x="42" y="18" width="178" height="178" preserveAspectRatio="xMidYMid meet" filter="url(#logoShadow)"/>
    <rect x="24" y="184" width="214" height="14" rx="7" fill="#302b24"/>
    <rect x="24" y="184" width="128" height="14" rx="7" fill="#ea701d"/>
  </g>
  <text x="426" y="274" fill="#f5f5dc" font-family="Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">Free open-source</text>
  <text x="426" y="348" fill="#f5f5dc" font-family="Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">GIF editing</text>
  <text x="426" y="405" fill="rgba(245,245,220,0.72)" font-family="Arial, sans-serif" font-size="28" font-weight="700">Timeline edits, effects, overlays, bulk export.</text>
  <g transform="translate(426 458)" fill="none" stroke-width="2">
    <rect width="128" height="38" rx="19" fill="rgba(5,140,66,0.2)" stroke="#058c42"/>
    <text x="64" y="25" text-anchor="middle" fill="#f5f5dc" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800">NO WATERMARK</text>
    <rect x="144" width="116" height="38" rx="19" fill="rgba(234,112,29,0.18)" stroke="#ea701d"/>
    <text x="202" y="25" text-anchor="middle" fill="#f5f5dc" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800">BROWSER APP</text>
    <rect x="276" width="120" height="38" rx="19" fill="rgba(245,245,220,0.08)" stroke="rgba(245,245,220,0.28)"/>
    <text x="336" y="25" text-anchor="middle" fill="#f5f5dc" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800">OPEN SOURCE</text>
  </g>
</svg>
